<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>急診 CPR 快速紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-active:active { transform: scale(0.96); transition: transform 0.1s; }
        @keyframes flash {
            0%, 100% { background-color: #fca5a5; color: #991b1b; }
            50% { background-color: #ef4444; color: white; }
        }
        .timer-warning { animation: flash 1s infinite; }
        input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
        .filter-active { background-color: #0f766e; color: white; border-color: #0f766e; }
        .filter-inactive { background-color: #1e293b; color: #94a3b8; border-color: #334155; }
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans text-slate-800 select-none overflow-hidden pb-[60px]">

    <!-- ==================== 頂部全局鎖定區塊 ==================== -->
    <div id="header-bar" class="bg-white shadow-md z-20 px-3 py-2 flex flex-col gap-2 transition-colors duration-300">
        
        <!-- 全局控制列 -->
        <div class="flex justify-between items-center gap-2">
            <button id="btn-start" onclick="toggleCPR()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold text-sm btn-active shadow-sm flex justify-center items-center gap-1">
                <i class="fa-solid fa-play"></i> 開始計時
            </button>
            <button onclick="logCode999()" class="flex-1 bg-red-600 text-white py-2 rounded-lg font-bold text-sm btn-active shadow-sm flex justify-center items-center gap-1">
                <i class="fa-solid fa-truck-medical"></i> 啟動999
            </button>
            <button id="btn-rosc" onclick="logROSC()" class="flex-1 bg-emerald-500 text-white py-2 rounded-lg font-bold text-sm btn-active shadow-sm flex justify-center items-center gap-1 opacity-50 pointer-events-none transition-opacity">
                <i class="fa-solid fa-heart-pulse"></i> ROSC
            </button>
            <button onclick="toggleSound()" id="btn-sound" class="text-slate-500 px-2 py-2 text-lg">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <!-- 計時器列 -->
        <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200">
            <div class="text-center w-1/3">
                <div class="text-[10px] text-slate-500 font-bold">現在時間</div>
                <div id="real-clock" class="text-base md:text-xl font-mono font-bold text-slate-700">00:00:00</div>
            </div>
            <div class="w-px h-8 bg-slate-300"></div>
            <div class="text-center w-1/3">
                <div class="text-[10px] text-slate-500 font-bold">急救總時間</div>
                <div id="total-timer" class="text-lg md:text-2xl font-mono font-bold text-blue-600">00:00:00</div>
            </div>
            <div class="w-px h-8 bg-slate-300"></div>
            <div class="text-center w-1/3">
                <div class="text-[10px] text-slate-500 font-bold">CPR 循環</div>
                <div id="cpr-timer" class="text-lg md:text-2xl font-mono font-bold text-orange-500">02:00</div>
            </div>
        </div>
    </div>

    <!-- 迷你提示框 (Toast) -->
    <div id="toast" class="fixed top-36 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-sm font-bold shadow-lg z-50 hidden opacity-0 transition-opacity flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">已紀錄</span>
    </div>

    <!-- ==================== 主內容區 ==================== -->
    <div class="flex-1 relative overflow-hidden">
        
        <!-- ============ 頁籤 1：執行處置 ============ -->
        <div id="view-actions" class="absolute inset-0 overflow-y-auto no-scrollbar p-3 flex flex-col gap-3 opacity-50 pointer-events-none transition-opacity pb-10">
            
            <!-- 循環評估 -->
            <button onclick="openCycleModal()" class="w-full bg-orange-100 text-orange-800 border-2 border-orange-300 py-3 rounded-xl font-bold md:text-lg btn-active shadow-sm flex justify-center items-center gap-2">
                <i class="fa-solid fa-clipboard-list"></i> 📝 2分鐘 CPR 循環評估
            </button>

            <!-- 心律面板 (三層架構) -->
            <div class="bg-white rounded-xl shadow-sm p-3 border border-slate-100">
                <h3 class="font-bold text-slate-500 mb-2 text-xs">心律 (Rhythm)</h3>
                <div class="flex flex-col gap-2">
                    <!-- 灰色層 -->
                    <div class="flex gap-2">
                        <button onclick="logRhythm('Asystole')" class="flex-1 bg-slate-100 text-slate-700 border border-slate-300 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">Asystole</button>
                        <button onclick="logRhythm('PEA')" class="flex-1 bg-slate-100 text-slate-700 border border-slate-300 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">PEA</button>
                    </div>
                    <!-- 紅色層 (危險心律) -->
                    <div class="flex flex-wrap gap-2">
                        <button onclick="logRhythm('VF')" class="flex-1 min-w-[70px] bg-red-50 text-red-700 border border-red-200 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">VF</button>
                        <button onclick="logRhythm('VT')" class="flex-1 min-w-[70px] bg-red-50 text-red-700 border border-red-200 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">VT</button>
                        <button onclick="logRhythm('Torsades')" class="flex-1 min-w-[80px] bg-red-50 text-red-700 border border-red-200 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">Torsades</button>
                        <button onclick="logRhythm('Pulseless VT')" class="w-[48%] bg-red-50 text-red-700 border border-red-200 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">Pulseless VT</button>
                        <button onclick="logRhythm('Pulseless Torsades')" class="w-[48%] bg-red-50 text-red-700 border border-red-200 py-2 rounded-lg font-bold text-[10px] md:text-sm btn-active leading-tight">Pulseless<br>Torsades</button>
                    </div>
                    <!-- 藍色層 -->
                    <div class="flex gap-2">
                        <button onclick="logRhythm('PSVT')" class="flex-1 bg-blue-50 text-blue-700 border border-blue-200 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">PSVT</button>
                        <button onclick="logRhythm('Bradycardia')" class="flex-1 bg-blue-50 text-blue-700 border border-blue-200 py-2 rounded-lg font-bold text-xs md:text-sm btn-active">Bradycardia</button>
                    </div>
                </div>
                
                <!-- 電擊 (連動展開) -->
                <div id="shock-panel" class="mt-2 pt-2 border-t border-slate-100 hidden">
                    <h3 class="font-bold text-red-500 mb-2 text-xs flex justify-between items-center">
                        <span>⚡ 建議電擊 (選擇焦耳)</span>
                        <button onclick="resetShock()" class="text-slate-400 text-[10px] bg-slate-100 px-2 py-1 rounded">取消</button>
                    </h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="logEvent('電擊', '150 J'); resetShock();" class="bg-red-500 text-white py-2 rounded-lg font-bold text-sm md:text-base btn-active shadow-sm">150 J</button>
                        <button onclick="logEvent('電擊', '200 J'); resetShock();" class="bg-red-500 text-white py-2 rounded-lg font-bold text-sm md:text-base btn-active shadow-sm">200 J</button>
                        <button onclick="logEvent('電擊', '360 J'); resetShock();" class="bg-red-500 text-white py-2 rounded-lg font-bold text-sm md:text-base btn-active shadow-sm">360 J</button>
                    </div>
                </div>
            </div>

            <!-- 急救藥物 -->
            <div class="bg-white rounded-xl shadow-sm p-3 border border-slate-100">
                <h3 class="font-bold text-slate-500 mb-2 text-xs">急救藥物 (點擊選擇數量)</h3>
                
                <!-- Adrenalin -->
                <button onclick="giveEpi()" class="w-full bg-red-100 text-red-800 border-2 border-red-300 py-4 px-4 rounded-xl font-bold text-base md:text-lg btn-active flex justify-between items-center mb-3 relative">
                    <div class="flex items-center gap-2">
                        <span>Adrenalin 1mg</span>
                        <span id="epi-badge-count" class="hidden bg-red-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full absolute -top-2 -right-2 shadow-sm border border-white">0</span>
                    </div>
                    <span id="epi-timer-badge" class="hidden bg-red-600 text-white text-xs px-2 py-1 rounded-md">03:00</span>
                </button>

                <!-- 其他急救藥物 (中性配色、大字體、置中) -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openMedModal('CORDARONE 150mg')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">CORDARONE</button>
                    <button onclick="openMedModal('Atropine 1mg')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">Atropine</button>
                    <button onclick="openMedModal('Rolikan 7% 20mL')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">Rolikan</button>
                    <button onclick="openMedModal('MgSO4 2g')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">MgSO4</button>
                    <button onclick="openMedModal('Norepinephrine')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">Norepinephrine</button>
                    <button onclick="openMedModal('Dopamin 200mg')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">Dopamin</button>
                    <button onclick="openMedModal('DORMICUM 5mg')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">DORMICUM</button>
                    <button onclick="openMedModal('FURSEMIDE 20mg')" class="bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-lg font-bold text-base btn-active px-2 truncate text-center shadow-sm">FURSEMIDE</button>
                </div>
            </div>

            <!-- 大量點滴 (獨立卡片) -->
            <div class="bg-white rounded-xl shadow-sm p-3 border border-slate-100">
                <h3 class="font-bold text-slate-500 mb-2 text-xs">大量點滴 (IV Fluids)</h3>
                <div class="flex gap-2">
                    <button onclick="openMedModal('大量點滴 N/S')" class="flex-1 bg-white text-cyan-700 border-2 border-cyan-200 py-3 rounded-lg font-bold text-base btn-active text-center shadow-sm">N/S</button>
                    <button onclick="openMedModal('大量點滴 L/R')" class="flex-1 bg-white text-cyan-700 border-2 border-cyan-200 py-3 rounded-lg font-bold text-base btn-active text-center shadow-sm">L/R</button>
                </div>
            </div>

            <!-- 管路處置 (結構化) -->
            <div class="bg-white rounded-xl shadow-sm p-3 border border-slate-100 mb-6">
                <h3 class="font-bold text-slate-500 mb-2 text-xs">管路建立 (Lines/Tubes)</h3>
                
                <div class="flex overflow-x-auto gap-2 pb-2 no-scrollbar border-b border-slate-100">
                    <button onclick="switchTubeTab('endo')" id="tab-endo" class="tube-tab px-3 py-1.5 rounded-full bg-teal-100 text-teal-800 font-bold text-xs flex-shrink-0">Endo</button>
                    <button onclick="switchTubeTab('ng')" id="tab-ng" class="tube-tab px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex-shrink-0">NG</button>
                    <button onclick="switchTubeTab('foley')" id="tab-foley" class="tube-tab px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex-shrink-0">Foley</button>
                    <button onclick="switchTubeTab('chest')" id="tab-chest" class="tube-tab px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex-shrink-0">Chest Tube</button>
                    <button onclick="switchTubeTab('ic')" id="tab-ic" class="tube-tab px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex-shrink-0">IC</button>
                    <button onclick="switchTubeTab('cvc')" id="tab-cvc" class="tube-tab px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex-shrink-0">CVC</button>
                    <button onclick="switchTubeTab('io')" id="tab-io" class="tube-tab px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs flex-shrink-0">骨內針</button>
                </div>

                <div class="pt-3">
                    <!-- Endo -->
                    <div id="panel-endo" class="tube-panel flex gap-2 items-end">
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">內徑(mm)</label><input type="number" step="0.5" id="val-endo-size" value="7.5" class="w-full p-2 border border-slate-300 rounded text-sm text-center bg-slate-50"></div>
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">深度(cm)</label><input type="number" id="val-endo-depth" value="22" class="w-full p-2 border border-slate-300 rounded text-sm text-center bg-slate-50"></div>
                        <button onclick="logTube('Endo', `Size: ${document.getElementById('val-endo-size').value}mm, Depth: ${document.getElementById('val-endo-depth').value}cm`)" class="bg-teal-500 text-white h-[36px] px-3 rounded font-bold text-sm btn-active">紀錄</button>
                    </div>
                    <!-- NG (更新預設值) -->
                    <div id="panel-ng" class="tube-panel hidden flex gap-2 items-end">
                        <select id="val-ng-site" class="w-16 p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>左鼻</option><option>右鼻</option><option>口</option></select>
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">Fr</label><input type="number" id="val-ng-fr" value="16" class="w-full p-2 border border-slate-300 rounded text-sm text-center bg-slate-50"></div>
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">Fix(cm)</label><input type="number" id="val-ng-fix" value="60" class="w-full p-2 border border-slate-300 rounded text-sm text-center bg-slate-50"></div>
                        <button onclick="logTube('NG', `部位: ${document.getElementById('val-ng-site').value}, ${document.getElementById('val-ng-fr').value}Fr, Fix: ${document.getElementById('val-ng-fix').value}cm`)" class="bg-teal-500 text-white h-[36px] px-3 rounded font-bold text-sm btn-active">紀錄</button>
                    </div>
                    <!-- Foley (更新預設值) -->
                    <div id="panel-foley" class="tube-panel hidden flex flex-col gap-2">
                        <div class="flex gap-2">
                            <select id="val-foley-type" class="p-2 border border-slate-300 rounded text-sm bg-slate-50 flex-1"><option>2-Way</option><option>3-Way</option></select>
                            <select id="val-foley-mat" class="p-2 border border-slate-300 rounded text-sm bg-slate-50 flex-1"><option>一般</option><option>矽質</option></select>
                        </div>
                        <div class="flex gap-2 items-end">
                            <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">Fr</label><input type="number" id="val-foley-fr" value="16" class="w-full p-2 border border-slate-300 rounded text-sm text-center bg-slate-50"></div>
                            <button onclick="logTube('Foley', `${document.getElementById('val-foley-type').value} ${document.getElementById('val-foley-mat').value}, ${document.getElementById('val-foley-fr').value}Fr`)" class="bg-teal-500 text-white h-[36px] px-4 rounded font-bold text-sm btn-active">紀錄</button>
                        </div>
                    </div>
                    <!-- Chest Tube -->
                    <div id="panel-chest" class="tube-panel hidden flex gap-2 items-end">
                        <select id="val-chest-site" class="w-16 p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>左側</option><option>右側</option></select>
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">Fr</label><input type="text" id="val-chest-fr" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"></div>
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">Fix(cm/格)</label><input type="text" id="val-chest-fix" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"></div>
                        <button onclick="logTube('Chest Tube', `部位: ${document.getElementById('val-chest-site').value}, ${document.getElementById('val-chest-fr').value}Fr, Fix: ${document.getElementById('val-chest-fix').value}`)" class="bg-teal-500 text-white h-[36px] px-3 rounded font-bold text-sm btn-active">紀錄</button>
                    </div>
                    <!-- IC -->
                    <div id="panel-ic" class="tube-panel hidden flex gap-2 items-end">
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">部位</label>
                            <select id="val-ic-site" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>左手背</option><option>右手背</option><option>左前臂</option><option>右前臂</option><option>其他</option></select>
                        </div>
                        <div class="w-20"><label class="block text-[10px] text-slate-500 mb-1">號數</label>
                            <select id="val-ic-g" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>20G</option><option>18G</option><option>22G</option><option>24G</option></select>
                        </div>
                        <button onclick="logTube('IC', `部位: ${document.getElementById('val-ic-site').value}, ${document.getElementById('val-ic-g').value}`)" class="bg-teal-500 text-white h-[36px] px-3 rounded font-bold text-sm btn-active">紀錄</button>
                    </div>
                    <!-- CVC -->
                    <div id="panel-cvc" class="tube-panel hidden flex gap-2 items-end">
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">部位</label>
                            <select id="val-cvc-site" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>右頸靜脈</option><option>左頸靜脈</option><option>右鎖骨下</option><option>左鎖骨下</option><option>右股靜脈</option><option>左股靜脈</option></select>
                        </div>
                        <div class="w-24"><label class="block text-[10px] text-slate-500 mb-1">Lumen</label>
                            <select id="val-cvc-lumen" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>Double</option><option>Triple</option><option>Single</option></select>
                        </div>
                        <button onclick="logTube('CVC', `部位: ${document.getElementById('val-cvc-site').value}, ${document.getElementById('val-cvc-lumen').value}`)" class="bg-teal-500 text-white h-[36px] px-3 rounded font-bold text-sm btn-active">紀錄</button>
                    </div>
                    <!-- IO -->
                    <div id="panel-io" class="tube-panel hidden flex gap-2 items-end">
                        <div class="flex-1"><label class="block text-[10px] text-slate-500 mb-1">施打部位</label>
                            <select id="val-io-site" class="w-full p-2 border border-slate-300 rounded text-sm bg-slate-50"><option>右側脛骨近端</option><option>左側脛骨近端</option><option>右側肱骨</option><option>左側肱骨</option></select>
                        </div>
                        <button onclick="logTube('骨內針', `部位: ${document.getElementById('val-io-site').value}`)" class="bg-teal-500 text-white h-[36px] px-4 rounded font-bold text-sm btn-active">紀錄</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============ 頁籤 2：處置時間軸 ============ -->
        <div id="view-timeline" class="absolute inset-0 flex flex-col bg-slate-800 text-slate-100 hidden">
            
            <div class="p-2 border-b border-slate-700 flex justify-between items-center bg-slate-900 shrink-0">
                <span class="text-xs text-slate-400">點擊時間修改，點垃圾桶刪除</span>
                <button onclick="openSummaryModal()" class="bg-purple-600 text-white px-3 py-1.5 rounded text-xs font-bold btn-active flex items-center gap-1">
                    <i class="fa-solid fa-pills"></i> 藥物總計
                </button>
            </div>

            <!-- 過濾器 -->
            <div class="flex gap-2 p-2 bg-slate-900 border-b border-slate-700 overflow-x-auto no-scrollbar shrink-0">
                <button onclick="setFilter('全部')" id="flt-全部" class="filter-btn filter-active border px-3 py-1 rounded-full text-[10px] md:text-xs font-bold whitespace-nowrap">全部</button>
                <button onclick="setFilter('給藥')" id="flt-給藥" class="filter-btn filter-inactive border px-3 py-1 rounded-full text-[10px] md:text-xs font-bold whitespace-nowrap">給藥/點滴</button>
                <button onclick="setFilter('心律')" id="flt-心律" class="filter-btn filter-inactive border px-3 py-1 rounded-full text-[10px] md:text-xs font-bold whitespace-nowrap">心律/電擊</button>
                <button onclick="setFilter('管路')" id="flt-管路" class="filter-btn filter-inactive border px-3 py-1 rounded-full text-[10px] md:text-xs font-bold whitespace-nowrap">管路</button>
                <button onclick="setFilter('系統')" id="flt-系統" class="filter-btn filter-inactive border px-3 py-1 rounded-full text-[10px] md:text-xs font-bold whitespace-nowrap">系統/備註</button>
            </div>

            <div class="p-2 bg-slate-900 border-b border-slate-700 flex gap-2 shrink-0">
                <input type="text" id="custom-note" placeholder="快速自訂備註..." class="flex-1 bg-slate-800 text-white border border-slate-600 rounded px-2 py-1.5 text-sm focus:outline-none">
                <button onclick="submitCustomNote()" class="bg-teal-600 text-white px-3 py-1.5 rounded text-sm font-bold btn-active">送出</button>
            </div>

            <ul id="timeline-list" class="flex-1 overflow-y-auto p-2 space-y-2 no-scrollbar pb-20">
                <li class="text-slate-500 text-sm text-center mt-10">尚未開始急救</li>
            </ul>

            <div class="p-2 bg-slate-900 border-t border-slate-700 shrink-0">
                <button onclick="generateReport()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold text-sm btn-active mb-2"><i class="fa-solid fa-file-lines"></i> 生成護理紀錄</button>
                <textarea id="report-output" class="w-full h-24 bg-slate-800 text-slate-200 border border-slate-600 rounded p-2 text-xs no-scrollbar hidden" readonly></textarea>
            </div>
        </div>
    </div>

    <!-- ==================== 底部導航列 ==================== -->
    <div class="fixed bottom-0 w-full bg-white border-t border-slate-200 flex h-[60px] z-20 pb-safe">
        <button onclick="switchMainTab('actions')" id="nav-actions" class="flex-1 flex flex-col items-center justify-center text-blue-600 font-bold transition-colors">
            <i class="fa-solid fa-syringe text-xl mb-1"></i>
            <span class="text-[10px]">執行處置</span>
        </button>
        <button onclick="switchMainTab('timeline')" id="nav-timeline" class="flex-1 flex flex-col items-center justify-center text-slate-400 font-medium transition-colors">
            <i class="fa-solid fa-list-ul text-xl mb-1"></i>
            <span class="text-[10px]">時間軸</span>
        </button>
    </div>

    <!-- ==================== 彈出視窗 (Modals) ==================== -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex justify-center items-center p-4">
        
        <!-- 1. 藥物數量快選 Modal -->
        <div id="modal-med" class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl hidden flex-col gap-4">
            <h3 class="text-lg font-bold text-slate-700 text-center border-b pb-2" id="med-modal-title">藥物名稱</h3>
            <div class="flex justify-center items-center gap-6 py-2">
                <button onclick="adjMedQty(-1)" class="w-12 h-12 rounded-full bg-slate-100 text-slate-600 text-2xl font-bold btn-active border border-slate-300">-</button>
                <span id="med-modal-qty" class="text-4xl font-bold text-blue-600 w-12 text-center">1</span>
                <button onclick="adjMedQty(1)" class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 text-2xl font-bold btn-active border border-blue-300">+</button>
            </div>
            
            <div id="pump-run-container" class="hidden bg-slate-50 border border-slate-200 p-3 rounded-lg flex justify-between items-center">
                <label class="text-sm font-bold text-slate-600">Pump Run (滴/分)</label>
                <input type="number" id="med-pump-run" value="10" class="w-20 p-2 border border-slate-300 rounded text-center font-bold">
            </div>

            <div class="flex gap-3 mt-2">
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-200 text-slate-700 rounded-xl font-bold btn-active">取消</button>
                <button onclick="confirmMed()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold btn-active">確認紀錄</button>
            </div>
        </div>

        <!-- 2. CPR 循環評估 Modal -->
        <div id="modal-cycle" class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl hidden flex-col gap-4">
            <h3 class="text-lg font-bold text-slate-700 border-b pb-2 flex justify-between">
                <span>📝 循環評估</span>
                <span id="cycle-count-label" class="text-orange-500 text-sm">第 1 循環</span>
            </h3>
            
            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">1. 評估心律</label>
                <select id="cycle-rhythm" onchange="autoSelectPulse(this.value)" class="w-full p-3 border border-slate-300 rounded-xl text-base bg-slate-50">
                    <option value="" disabled selected>請選擇當下心律</option>
                    <option value="VF">VF</option>
                    <option value="VT">VT</option>
                    <option value="Torsades">Torsades</option>
                    <option value="Pulseless VT">Pulseless VT</option>
                    <option value="Pulseless Torsades">Pulseless Torsades</option>
                    <option value="Asystole">Asystole</option>
                    <option value="PEA">PEA</option>
                    <option value="PSVT">PSVT</option>
                    <option value="Bradycardia">Bradycardia</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-600 mb-2">2. 脈搏觸診 (已自動判定)</label>
                <div class="flex gap-2">
                    <button id="btn-pulse-no" onclick="setPulse('無脈搏')" class="flex-1 py-3 border-2 border-slate-200 bg-slate-50 text-slate-500 rounded-xl font-bold">無脈搏</button>
                    <button id="btn-pulse-yes" onclick="setPulse('摸到脈搏')" class="flex-1 py-3 border-2 border-slate-200 bg-slate-50 text-slate-500 rounded-xl font-bold">摸到脈搏</button>
                </div>
            </div>

            <div class="flex gap-3 mt-4">
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-200 text-slate-700 rounded-xl font-bold btn-active">取消</button>
                <button onclick="confirmCycle()" class="flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold btn-active">完成評估</button>
            </div>
        </div>

        <!-- 3. 藥物總計 Modal -->
        <div id="modal-summary" class="bg-slate-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl hidden flex-col gap-4 border border-slate-600">
            <h3 class="text-lg font-bold text-white border-b border-slate-600 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-pills text-purple-400"></i> 藥物與點滴總計
            </h3>
            <ul id="summary-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto no-scrollbar text-slate-200 text-sm">
            </ul>
            <button onclick="closeModal()" class="w-full py-3 bg-slate-600 text-white rounded-xl font-bold btn-active mt-2">關閉</button>
        </div>

    </div>

    <script>
        // --- 核心狀態 ---
        let isRunning = false;
        let isTotalTimerRunning = false;
        let totalSeconds = 0;
        let cprSeconds = 120; 
        let epiSeconds = 0;
        let cycleCount = 1;
        let timerInterval;
        let events = [];
        let systemStartTime = null;
        let audioCtx = null;
        let audioEnabled = true;

        let medSummaryDict = {};
        let currentFilter = '全部';
        let activeMedName = '';
        let activeMedQty = 1;
        let activePulse = '';

        // 時鐘初始化
        setInterval(() => {
            let now = new Date();
            document.getElementById('real-clock').innerText = now.toTimeString().substring(0,8);
        }, 1000);

        function formatTimeMinSec(sec) {
            let m = Math.floor(sec / 60).toString().padStart(2, '0');
            let s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        function formatTimeFull(sec) {
            let h = Math.floor(sec / 3600).toString().padStart(2, '0');
            let m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            let s = (sec % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // --- 核心計時 ---
        function toggleCPR() {
            let btnStart = document.getElementById('btn-start');
            let panel = document.getElementById('view-actions');
            let btnRosc = document.getElementById('btn-rosc');
            
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            if (!isRunning) {
                if(!systemStartTime) systemStartTime = document.getElementById('real-clock').innerText;
                
                isRunning = true;
                isTotalTimerRunning = true;
                panel.classList.remove('opacity-50', 'pointer-events-none');
                btnRosc.classList.remove('opacity-50', 'pointer-events-none');
                
                btnStart.innerHTML = '<i class="fa-solid fa-pause"></i> 暫停計時';
                btnStart.className = 'flex-1 bg-yellow-500 text-white py-2 rounded-lg font-bold text-sm btn-active shadow-sm flex justify-center items-center gap-1';
                
                logEvent('系統', '啟動急救計時');
                
                timerInterval = setInterval(() => {
                    // 總時間 (受 ROSC 影響)
                    if(isTotalTimerRunning) {
                        totalSeconds++;
                        document.getElementById('total-timer').innerText = formatTimeFull(totalSeconds);
                    }
                    
                    // CPR 循環
                    if(cprSeconds > 0) {
                        cprSeconds--;
                        document.getElementById('cpr-timer').innerText = formatTimeMinSec(cprSeconds);
                    } else if (cprSeconds === 0) {
                        showToast("⚠️ 2分鐘循環時間到");
                        if(audioEnabled) playSharpBeep(1);
                        cprSeconds = -1; 
                    }

                    // Epi 倒數
                    if (epiSeconds > 0) {
                        epiSeconds--;
                        let badge = document.getElementById('epi-timer-badge');
                        badge.innerText = formatTimeMinSec(epiSeconds);
                        if (epiSeconds <= 30) badge.classList.add('timer-warning');
                        
                        if (epiSeconds === 0) {
                            showToast("⚠️ Adrenalin 3分鐘已到！", true);
                            if(audioEnabled) playSharpBeep(3); // 強烈三聲警報
                            badge.classList.remove('timer-warning');
                            badge.classList.add('bg-red-800');
                            badge.innerText = "超時!";
                        }
                    }
                }, 1000);
            } else {
                isRunning = false;
                isTotalTimerRunning = false;
                panel.classList.add('opacity-50', 'pointer-events-none');
                btnStart.innerHTML = '<i class="fa-solid fa-play"></i> 繼續計時';
                btnStart.className = 'flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold text-sm btn-active shadow-sm flex justify-center items-center gap-1';
                clearInterval(timerInterval);
            }
        }

        // --- ROSC 解鎖與暫停總時間 ---
        function logROSC() {
            logEvent('系統', '★★ 達成 ROSC ★★');
            cprSeconds = -1;
            document.getElementById('cpr-timer').innerText = "--:--";
            
            // 暫停總時間
            isTotalTimerRunning = false;
            
            // 暫停 Adrenalin 倒數
            if(epiSeconds > 0) {
                epiSeconds = -1;
                let badge = document.getElementById('epi-timer-badge');
                badge.innerText = "暫停";
                badge.classList.remove('timer-warning');
                badge.classList.replace('bg-red-600', 'bg-slate-500');
            }
            showToast("已紀錄 ROSC，停止所有計時");
        }

        function logCode999() {
            logEvent('系統', '🚨 啟動 999 呼叫');
            if(!isRunning) toggleCPR(); 
        }

        // --- 音效 (優化為尖銳方波) ---
        function toggleSound() {
            audioEnabled = !audioEnabled;
            let icon = document.getElementById('btn-sound');
            if(audioEnabled) {
                icon.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                icon.classList.remove('text-red-400');
                showToast("提示音已開啟");
            } else {
                icon.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                icon.classList.add('text-red-400');
                showToast("提示音已靜音");
            }
        }
        function playSharpBeep(times) {
            if(!audioCtx || !audioEnabled) return;
            function beep() {
                const osc = audioCtx.createOscillator();
                osc.type = 'square'; // 穿透力更強的方波
                osc.connect(audioCtx.destination);
                osc.frequency.value = 1000; // 較高頻
                osc.start();
                setTimeout(() => osc.stop(), 150); // 短促的嗶聲
            }
            beep();
            if(times > 1) setTimeout(() => playSharpBeep(times - 1), 250);
        }

        // --- 藥物邏輯 ---
        function updateMedSummary(name, qty) {
            if(!medSummaryDict[name]) medSummaryDict[name] = 0;
            medSummaryDict[name] += qty;
        }

        function giveEpi() {
            let name = 'Adrenalin 1mg';
            updateMedSummary(name, 1);
            let count = medSummaryDict[name];
            
            epiSeconds = 180;
            let countBadge = document.getElementById('epi-badge-count');
            let timerBadge = document.getElementById('epi-timer-badge');
            
            countBadge.innerText = count;
            countBadge.classList.remove('hidden');
            
            timerBadge.innerText = "03:00";
            timerBadge.classList.remove('hidden', 'bg-red-800', 'bg-slate-500', 'timer-warning');
            timerBadge.classList.add('bg-red-600');
            
            logEvent('給藥', `${name} (累計:${count}支)`);
        }

        function openMedModal(name) {
            activeMedName = name;
            activeMedQty = 1;
            document.getElementById('med-modal-title').innerText = name;
            document.getElementById('med-modal-qty').innerText = activeMedQty;
            
            let pumpContainer = document.getElementById('pump-run-container');
            if(name === 'Norepinephrine' || name.includes('Dopamin')) {
                pumpContainer.classList.remove('hidden');
                document.getElementById('med-pump-run').value = 10;
            } else {
                pumpContainer.classList.add('hidden');
            }

            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById('modal-med').classList.remove('hidden');
            document.getElementById('modal-cycle').classList.add('hidden');
            document.getElementById('modal-summary').classList.add('hidden');
        }

        function adjMedQty(val) {
            if(activeMedQty + val > 0 && activeMedQty + val < 20) {
                activeMedQty += val;
                document.getElementById('med-modal-qty').innerText = activeMedQty;
            }
        }

        function confirmMed() {
            updateMedSummary(activeMedName, activeMedQty);
            let type = activeMedName.includes('大量點滴') ? '大量點滴' : '給藥';
            let detail = `${activeMedName} x ${activeMedQty}`;
            
            if(activeMedName === 'Norepinephrine' || activeMedName.includes('Dopamin')) {
                let pr = document.getElementById('med-pump-run').value;
                detail += ` (Pump Run: ${pr} 滴/分)`;
            }
            
            logEvent(type, detail);
            closeModal();
        }

        // --- 藥物總計 Modal ---
        function openSummaryModal() {
            let list = document.getElementById('summary-list');
            list.innerHTML = '';
            
            if(Object.keys(medSummaryDict).length === 0) {
                list.innerHTML = '<li class="text-slate-400 text-center py-4">尚未給予任何藥物</li>';
            } else {
                for(let [name, qty] of Object.entries(medSummaryDict)) {
                    list.innerHTML += `<li class="flex justify-between border-b border-slate-700 py-2">
                        <span>${name}</span>
                        <span class="font-bold text-teal-300">${qty}</span>
                    </li>`;
                }
            }

            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById('modal-summary').classList.remove('hidden');
            document.getElementById('modal-med').classList.add('hidden');
            document.getElementById('modal-cycle').classList.add('hidden');
        }

        // --- 循環評估 Modal ---
        function openCycleModal() {
            document.getElementById('cycle-count-label').innerText = `第 ${cycleCount} 循環`;
            activePulse = '';
            document.getElementById('cycle-rhythm').value = "";
            setPulse('');
            
            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById('modal-cycle').classList.remove('hidden');
            document.getElementById('modal-med').classList.add('hidden');
            document.getElementById('modal-summary').classList.add('hidden');
        }

        function autoSelectPulse(rhythm) {
            let noPulse = ['VF', 'Pulseless VT', 'Pulseless Torsades', 'Asystole', 'PEA'];
            let hasPulse = ['PSVT', 'Bradycardia', 'VT', 'Torsades'];
            
            if(noPulse.includes(rhythm)) setPulse('無脈搏');
            else if(hasPulse.includes(rhythm)) setPulse('摸到脈搏');
        }

        function setPulse(val) {
            activePulse = val;
            let btnNo = document.getElementById('btn-pulse-no');
            let btnYes = document.getElementById('btn-pulse-yes');
            
            btnNo.className = 'flex-1 py-3 rounded-xl font-bold border-2 ' + (val === '無脈搏' ? 'border-red-400 bg-red-100 text-red-700' : 'border-slate-200 bg-slate-50 text-slate-500');
            btnYes.className = 'flex-1 py-3 rounded-xl font-bold border-2 ' + (val === '摸到脈搏' ? 'border-emerald-400 bg-emerald-100 text-emerald-700' : 'border-slate-200 bg-slate-50 text-slate-500');
        }

        function confirmCycle() {
            let rhythm = document.getElementById('cycle-rhythm').value;
            if(!rhythm) return alert('請選擇心律');
            if(!activePulse) return alert('請選擇脈搏狀態');
            
            logEvent('循環評估', `[第${cycleCount}循環] 心律: ${rhythm}, ${activePulse}`);
            
            cprSeconds = 120;
            cycleCount++;
            document.getElementById('cpr-timer').innerText = "02:00";
            
            if(activePulse === '摸到脈搏') {
                setTimeout(() => { if(confirm('已摸到脈搏，是否自動記錄 ROSC 並暫停計時？')) logROSC(); }, 500);
            }
            closeModal();
        }

        function closeModal() { document.getElementById('modal-backdrop').classList.add('hidden'); }

        // --- 心律與管路 ---
        const shockable = ['VF', 'VT', 'Torsades', 'Pulseless VT', 'Pulseless Torsades'];
        function logRhythm(rhythm) {
            logEvent('心律', rhythm);
            let panel = document.getElementById('shock-panel');
            if (shockable.includes(rhythm)) {
                panel.classList.remove('hidden');
                panel.classList.add('fade-in');
            } else {
                resetShock();
            }
        }
        function resetShock() { document.getElementById('shock-panel').classList.add('hidden'); }

        function switchTubeTab(target) {
            document.querySelectorAll('.tube-tab').forEach(el => {
                el.classList.replace('bg-teal-100', 'bg-slate-100');
                el.classList.replace('text-teal-800', 'text-slate-600');
            });
            let act = document.getElementById('tab-'+target);
            act.classList.replace('bg-slate-100', 'bg-teal-100');
            act.classList.replace('text-slate-600', 'text-teal-800');
            
            document.querySelectorAll('.tube-panel').forEach(el => el.classList.add('hidden'));
            document.getElementById('panel-'+target).classList.remove('hidden');
        }
        function logTube(type, detail) { logEvent('管路', `[${type}] ${detail}`); }

        // --- 核心紀錄與 Toast ---
        function showToast(msg, isAlert = false) {
            let toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            if(isAlert) toast.classList.replace('bg-slate-800', 'bg-red-600');
            else toast.classList.replace('bg-red-600', 'bg-slate-800');
            
            toast.classList.remove('hidden', 'opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
            setTimeout(() => toast.classList.add('hidden'), 2300);
        }

        function submitCustomNote() {
            let input = document.getElementById('custom-note');
            if (input.value.trim() !== "") {
                logEvent('備註', input.value.trim());
                input.value = "";
            }
        }

        function logEvent(action, detail) {
            let event = {
                id: Date.now(),
                time: document.getElementById('real-clock').innerText,
                action: action,
                detail: detail
            };
            events.push(event);
            if(!action.includes('系統')) showToast(`${action}已紀錄`);
            renderTimeline();
        }

        // --- 雙頁籤與時間軸過濾 ---
        function switchMainTab(tab) {
            let navAct = document.getElementById('nav-actions');
            let navTime = document.getElementById('nav-timeline');
            let viewAct = document.getElementById('view-actions');
            let viewTime = document.getElementById('view-timeline');

            if(tab === 'actions') {
                navAct.classList.replace('text-slate-400', 'text-blue-600');
                navTime.classList.replace('text-blue-600', 'text-slate-400');
                viewTime.classList.add('hidden');
                viewAct.classList.remove('hidden');
            } else {
                navTime.classList.replace('text-slate-400', 'text-blue-600');
                navAct.classList.replace('text-blue-600', 'text-slate-400');
                viewAct.classList.add('hidden');
                viewTime.classList.remove('hidden');
                setFilter('全部');
            }
        }

        function setFilter(filterName) {
            currentFilter = filterName;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.replace('filter-active', 'filter-inactive');
            });
            document.getElementById('flt-' + filterName).classList.replace('filter-inactive', 'filter-active');
            renderTimeline();
        }

        function getActionColor(action) {
            if (action.includes('系統') || action.includes('備註')) return 'bg-gray-500 text-white';
            if (action.includes('循環評估')) return 'bg-orange-500 text-white';
            if (action.includes('心律') || action === '電擊') return 'bg-red-600 text-white';
            if (action === '給藥') return 'bg-purple-600 text-white';
            if (action === '大量點滴') return 'bg-cyan-600 text-white';
            if (action === '管路') return 'bg-teal-600 text-white';
            return 'bg-slate-700 text-white';
        }

        function renderTimeline() {
            let list = document.getElementById('timeline-list');
            list.innerHTML = '';
            let reversed = [...events].reverse();
            
            let filtered = reversed.filter(e => {
                if (currentFilter === '全部') return true;
                if (currentFilter === '給藥' && (e.action === '給藥' || e.action === '大量點滴')) return true;
                if (currentFilter === '心律' && (e.action.includes('心律') || e.action === '電擊')) return true;
                if (currentFilter === '管路' && e.action === '管路') return true;
                if (currentFilter === '系統' && (e.action.includes('系統') || e.action === '備註' || e.action === '循環評估')) return true;
                return false;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<li class="text-slate-500 text-sm text-center mt-10">此分類尚未有紀錄</li>`;
                return;
            }
            
            filtered.forEach(e => {
                let colorClass = e.detail.includes('ROSC') || e.detail.includes('999') ? 'text-red-400 font-bold' : 'text-slate-200';
                let li = document.createElement('li');
                li.className = 'bg-slate-700 p-2 rounded flex flex-col gap-1 shadow-sm';
                li.innerHTML = `
                    <div class="flex justify-between items-center">
                        <input type="time" step="1" value="${e.time}" onchange="updateTime(${e.id}, this.value)" class="bg-slate-800 border border-slate-600 rounded text-teal-400 font-mono text-[10px] md:text-xs px-1 py-0.5 focus:outline-none">
                        <button onclick="confirmDel(${e.id})" class="text-slate-400 hover:text-red-400 text-xs px-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="${colorClass} text-xs md:text-sm flex items-start">
                        <span class="${getActionColor(e.action)} px-1.5 py-0.5 rounded text-[10px] font-bold mr-2 shrink-0 mt-0.5">${e.action}</span>
                        <span class="leading-snug break-all">${e.detail}</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function updateTime(id, newTime) {
            let event = events.find(e => e.id === id);
            if(event) event.time = newTime;
        }

        function confirmDel(id) {
            if(confirm("確定要刪除這筆紀錄嗎？")) {
                events = events.filter(e => e.id !== id);
                renderTimeline();
            }
        }

        // --- 報表生成 ---
        function generateReport() {
            if (events.length === 0) return alert("無紀錄可生成！");
            let output = document.getElementById('report-output');
            output.classList.remove('hidden');
            let sorted = [...events].sort((a, b) => a.time.localeCompare(b.time));
            
            let text = `【急診急救護理紀錄】\n`;
            text += `啟動時間: ${systemStartTime || '未記錄'}\n`;
            text += `急救總歷時: ${document.getElementById('total-timer').innerText}\n`;
            text += `-----------------\n`;
            sorted.forEach(e => { text += `[${e.time}] ${e.action}: ${e.detail}\n`; });
            
            text += `-----------------\n【藥物與點滴總計】\n`;
            if(Object.keys(medSummaryDict).length === 0) {
                text += `(無給藥紀錄)\n`;
            } else {
                for(let [name, qty] of Object.entries(medSummaryDict)) {
                    text += `${name}: ${qty}\n`;
                }
            }
            
            text += `-----------------\n紀錄護理師: 李阿饅`;
            
            output.value = text;
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
